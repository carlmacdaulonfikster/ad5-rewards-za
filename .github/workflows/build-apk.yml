name: Build AD5 Rewards ZA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract connected source
        run: |
          unzip -q AD5-Rewards-ZA-GitHub-Ready-Supabase-Fixed.zip -d app
          test -f app/ad5inspect/package.json

      - name: Install and bundle
        working-directory: app/ad5inspect
        run: |
          npm install
          npm run build

      - name: Prepare Android
        working-directory: app/ad5inspect
        run: |
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      - name: Build APK
        working-directory: app/ad5inspect/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AD5-Rewards-ZA-APK
          path: app/ad5inspect/android/app/build/outputs/apk/debug/app-debug.apk

